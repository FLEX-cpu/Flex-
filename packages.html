<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<script>/*FB*/if(top!==self){document.documentElement.style.display="none"}/*END*/</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FLEX | الباقات والعروض</title>
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--card:#0c0c0d;--line:#1f1f22;--mut:#8d8f96;--red:#ff2a2a}
*{box-sizing:border-box;margin:0}
html{background:#000}
body{background:#000 radial-gradient(ellipse 70% 30% at 50% 0,rgba(255,42,42,.14),transparent 70%) no-repeat;color:#f4f4f5;font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:calc(22px + env(safe-area-inset-top,0px)) 18px calc(30px + env(safe-area-inset-bottom,0px))}
main{width:100%;max-width:440px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.top a{color:var(--mut);text-decoration:none;font-size:14px}
.top b{font-size:26px;font-weight:800;letter-spacing:5px;color:#ffecec;direction:ltr;text-shadow:0 0 6px #ff6a6a,0 0 18px var(--red),0 0 36px var(--red)}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.ic{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;background:linear-gradient(145deg,#ff2a2a,#b80000);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 24px rgba(255,42,42,.3);direction:ltr}
.hero h1{font-size:24px}.hero p{color:var(--mut);font-size:13.5px}
.card{background:linear-gradient(180deg,#111113,var(--card));border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.lbl{color:var(--mut);font-size:13px;margin-bottom:6px}
.num{font-size:26px;font-weight:800;letter-spacing:1px;direction:ltr;text-align:right}
.btn{display:block;width:100%;font:700 16px Cairo,sans-serif;text-align:center;text-decoration:none;border-radius:16px;padding:15px;border:1px solid var(--line);background:#16161a;color:#fff;margin-bottom:10px;cursor:pointer}
.btn.p{background:var(--red);border-color:var(--red);box-shadow:0 0 22px rgba(255,42,42,.35)}
.btn:active{transform:scale(.98)}
.wa{background:#25d366;border-color:#25d366;color:#04210f}
.lk{display:block;background:none;border:0;color:var(--mut);font:600 14px Cairo,sans-serif;text-decoration:underline;margin:4px auto 14px;cursor:pointer}
#fb{display:none;border-color:var(--red);box-shadow:0 0 24px rgba(255,42,42,.2)}
#fb .num{font-size:22px;margin-bottom:6px}
#fb p{color:var(--mut);font-size:13px;line-height:1.8;margin-bottom:12px}
.note{color:var(--mut);font-size:12.5px;text-align:center;line-height:1.9;margin-top:6px}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:#fff;color:#000;padding:10px 20px;border-radius:30px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
#toast.on{opacity:1;transform:translateX(-50%)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;font:700 14px Cairo,sans-serif;border-radius:14px;padding:12px 4px;border:1px solid var(--line);background:#0c0c0d;color:var(--mut);cursor:pointer}
.tab.on{color:#fff;border-color:var(--c);box-shadow:0 0 16px var(--g)}
.gt{font-size:15px;font-weight:800;margin:16px 4px 2px}
.gs{color:var(--mut);font-size:12.5px;margin:0 4px 10px}
.it{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#111113,var(--card));border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.pr{min-width:74px;text-align:center;border-radius:14px;padding:8px 6px;background:var(--c);color:#fff;box-shadow:0 0 14px var(--g)}
.pr span{display:block;font-size:24px;font-weight:800;line-height:1.1}
.pr small{font-size:11px;font-weight:600;opacity:.9}
.inf{flex:1;min-width:0}.inf b{display:block;font-size:16px}
.inf i{display:block;font-style:normal;color:var(--mut);font-size:12.5px;margin-top:2px}
.inf em{display:block;font-style:normal;color:#ffd24a;font-size:12.5px;margin-top:2px}
.tt{text-align:center;font-size:11px;color:var(--mut);border-radius:10px;background:#1a1a1d;padding:6px 8px}
.tt b{display:block;color:#fff;font-size:15px}
</style>
</head>
<body>
<main>
  <div class="top"><a href="index.html">› الرئيسية</a><b>FLEX</b></div>
  <div class="hero"><div class="ic" style="font-size:24px">★</div><div><h1>الباقات والعروض</h1><p>اختر الشبكة لعرض الأسعار</p></div></div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
  <p class="note" id="nt"></p>
  <p class="note">الأسعار قابلة للتغيير.</p>
</main>
<script src="data.js"></script>
<script>
// الأسعار والباقات بتتقرأ من data.js
// n=الاسم  p=السعر  g=الهدية (أسبوع)  t=الإجمالي
var D = window.FLEX.packages;
// ================================================================
var tabs=document.getElementById("tabs"), list=document.getElementById("list"), nt=document.getElementById("nt");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function show(i){
  var n=D[i];
  Array.prototype.forEach.call(tabs.children,function(b,k){b.className="tab"+(k==i?" on":"");if(k==i){b.style.setProperty("--c",n.c);b.style.setProperty("--g",n.g)}});
  list.style.setProperty("--c",n.c);list.style.setProperty("--g",n.g);
  list.innerHTML=n.groups.map(function(g){
    return '<div class="gt">'+esc(g.t)+'</div>'+(g.sub?'<div class="gs">'+esc(g.sub)+'</div>':'')+
    g.items.map(function(p){
      return '<div class="it"><div class="pr"><span>'+esc(p.p)+'</span><small>جنيه</small></div><div class="inf"><b>'+esc(p.n)+'</b>'+(p.x?'<i>'+esc(p.x)+'</i>':'')+(p.g?'<em>+ هدية '+esc(p.g)+' لمدة أسبوع</em>':'')+'</div>'+(p.t?'<div class="tt">الإجمالي<b>'+esc(p.t)+'</b></div>':'')+'</div>';
    }).join("");
  }).join("");
  nt.textContent=n.note||"";nt.style.display=n.note?"block":"none";
}
D.forEach(function(n,i){var b=document.createElement("button");b.className="tab";b.textContent=n.n;b.onclick=function(){show(i)};tabs.appendChild(b)});
show(0);
</script>
</body>
</html>
